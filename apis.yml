name: Vital Lyfe
description: >-
  Vital Lyfe is a Torrance, California hardware company building portable water
  purification technology designed to scale where infrastructure cannot reach.
  Its flagship product, Access, is a portable watermaker that converts naturally
  occurring water, including saltwater, into clean drinking water through a simple
  place-a-hose, press-start, hydrate workflow. The company sells the Access device
  and branded gear through a direct-to-consumer Shopify storefront and publishes a
  mission, team, careers, and journal. It was surfaced as a General Catalyst
  portfolio company and added to the API Evangelist network. As of this enrichment
  pass, Vital Lyfe is a consumer-hardware and e-commerce brand with no public API,
  SDK, or developer program surface.
